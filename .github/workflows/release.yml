name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write   # needed to push to ghcr.io

jobs:
  # ── Windows installer ────────────────────────────────────────────────────────
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download ffmpeg
        shell: pwsh
        run: tools/get-ffmpeg.ps1

      - name: Publish UI (self-contained, win-x64)
        run: >
          dotnet publish src/AudioBatchConverter.UI/AudioBatchConverter.UI.csproj
          -c Release -r win-x64 --self-contained

      - name: Publish Shell (framework-dependent, win-x64)
        run: >
          dotnet publish src/AudioBatchConverter.Shell/AudioBatchConverter.Shell.csproj
          -c Release -r win-x64 --no-self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc installer/setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Output/*.exe

  # ── Docker image → ghcr.io ───────────────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/audio-batch-converter:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/audio-batch-converter:latest

  # ── GitHub Release (waits for both) ─────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [build-installer, build-docker]

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract changelog section
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import re
          version = "${{ github.ref_name }}".lstrip('v')
          text = open('CHANGELOG.md').read()
          m = re.search(
              r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)',
              text, re.DOTALL)
          body = m.group(1).strip() if m else 'See [CHANGELOG.md](CHANGELOG.md) for the full history.'
          open('release-notes.md', 'w').write(body)
          PYEOF
          printf '\n---\n### Docker\n```\ndocker pull ghcr.io/%s/audio-batch-converter:%s\n```\nSee [docker-compose.yml](docker-compose.yml) for NAS setup.\n' \
            "$OWNER" "${{ github.ref_name }}" >> release-notes.md

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer-out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Audio Batch Converter ${{ github.ref_name }}"
          body_path: release-notes.md
          files: installer-out/*.exe
