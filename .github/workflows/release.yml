name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download ffmpeg
        shell: pwsh
        run: tools/get-ffmpeg.ps1

      - name: Publish UI (self-contained, win-x64)
        run: >
          dotnet publish src/AudioBatchConverter.UI/AudioBatchConverter.UI.csproj
          -c Release -r win-x64 --self-contained

      - name: Publish Shell (framework-dependent, win-x64)
        run: >
          dotnet publish src/AudioBatchConverter.Shell/AudioBatchConverter.Shell.csproj
          -c Release -r win-x64 --no-self-contained

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc installer/setup.iss

      - name: Extract changelog section
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $content  = Get-Content CHANGELOG.md -Raw
          $pattern  = "(?s)## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=\n## \[|\z)"
          if ($content -match $pattern) {
            $matches[1].Trim() | Set-Content release-notes.md
          } else {
            "See [CHANGELOG.md](CHANGELOG.md) for the full history." | Set-Content release-notes.md
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Output/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Audio Batch Converter ${{ github.ref_name }}"
          body_path: release-notes.md
          files: installer/Output/*.exe
