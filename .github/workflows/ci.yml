name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore audio-batch-converter.slnx

      - name: Build
        run: dotnet build audio-batch-converter.slnx --no-restore -c Release

      - name: Test
        run: dotnet test audio-batch-converter.slnx --no-build -c Release --verbosity normal
