<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio Batch Converter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #111;
      --surface:  #1c1c1e;
      --surface2: #252527;
      --border:   #2c2c2e;
      --text:     #f2f2f7;
      --muted:    #8e8e93;
      --accent:   #0a84ff;
      --green:    #30d158;
      --red:      #ff453a;
      --yellow:   #ffd60a;
      --orange:   #ff9f0a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-shrink: 0;
    }

    .topbar h1 { font-size: 16px; font-weight: 600; flex: 1; }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .spacer { flex: 1; }

    /* ── stats ── */
    .stats {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
    }

    .stat-item { display: flex; align-items: center; gap: 5px; }
    .stat-item .n { font-weight: 700; }
    .stat-item.converting .n { color: var(--accent); }
    .stat-item.done .n       { color: var(--green); }
    .stat-item.error .n      { color: var(--red); }
    .stat-item.saved .n      { color: var(--orange); }

    /* ── buttons ── */
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .12s;
      white-space: nowrap;
    }

    button:hover  { opacity: .85; }
    button:active { opacity: .7; }
    button:disabled { opacity: .4; cursor: default; }

    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    button.ghost:hover { color: var(--text); border-color: var(--muted); }

    /* ── job list ── */
    .job-scroll {
      flex: 1;
      overflow-y: auto;
    }

    .group {
      border-bottom: 1px solid var(--border);
    }

    .group-header {
      display: flex;
      align-items: center;
      padding: 7px 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      background: var(--surface);
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
    }

    .group-header:hover { color: var(--text); }

    .group-header .chevron {
      margin-right: 6px;
      transition: transform .15s;
      font-style: normal;
    }

    .group.collapsed .chevron { transform: rotate(-90deg); }
    .group.collapsed .group-files { display: none; }

    .job-row {
      display: grid;
      grid-template-columns: 108px 1fr 72px;
      align-items: center;
      padding: 7px 20px 7px 32px;
      border-top: 1px solid var(--border);
      transition: background .1s;
    }

    .job-row:hover { background: var(--surface2); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      padding: 2px 8px;
      width: fit-content;
    }

    .badge-queued    { background:#2a2a2c; color:var(--muted); }
    .badge-converting{ background:#0a2d55; color:var(--accent); }
    .badge-done      { background:#0d3320; color:var(--green); }
    .badge-error     { background:#3a1212; color:var(--red); }

    .spinner {
      width: 9px; height: 9px;
      border: 1.5px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .job-name {
      font-family: monospace;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-error {
      font-size: 11px;
      color: var(--red);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      grid-column: 2;
      padding-top: 1px;
    }

    .job-size {
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
      grid-column: 2;
      padding-top: 1px;
    }

    .job-size .size-saving { color: var(--orange); }

    .job-time {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }

    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      padding: 40px;
    }

    .empty-icon { font-size: 48px; opacity: .4; }
    .empty-text { font-size: 15px; }
    .empty-hint { font-size: 12px; }

    /* ── modal overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .overlay.hidden { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: min(680px, 95vw);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .modal-title { font-weight: 600; font-size: 15px; flex: 1; }

    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      padding: 0 4px;
      line-height: 1;
      cursor: pointer;
    }

    .close-btn:hover { color: var(--text); }

    /* ── breadcrumb ── */
    .breadcrumbs {
      display: flex;
      align-items: center;
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
      gap: 4px;
      flex-wrap: wrap;
      font-size: 12px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .crumb {
      color: var(--accent);
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .crumb:hover { background: rgba(10,132,255,.15); }
    .crumb.active { color: var(--text); cursor: default; font-weight: 600; }
    .crumb:not(:last-child)::after { content: " /"; color: var(--muted); margin-left: 4px; }

    /* ── browser list ── */
    .browser-list {
      flex: 1;
      overflow-y: auto;
    }

    .browser-entry {
      display: flex;
      align-items: center;
      padding: 8px 20px;
      gap: 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }

    .browser-entry:hover { background: var(--surface2); }

    .browser-entry .entry-icon { font-size: 16px; flex-shrink: 0; }
    .browser-entry .entry-name { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .browser-entry.audio .entry-name { font-family: monospace; }
    .browser-entry .converted-badge {
      font-size: 11px;
      color: var(--green);
      background: #0d3320;
      border-radius: 4px;
      padding: 1px 6px;
    }

    .browser-empty {
      padding: 32px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── modal footer ── */
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .modal-footer .path-display {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    label.check {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; }

    /* ── preview chip ── */
    .preview-chip {
      font-size: 12px;
      color: var(--muted);
      padding: 3px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      white-space: nowrap;
    }

    .preview-chip.has-files { color: var(--orange); border-color: var(--orange); }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- top bar -->
<div class="topbar">
  <h1>Audio Batch Converter</h1>
  <div class="live-dot" title="Live"></div>
</div>

<!-- toolbar -->
<div class="toolbar">
  <button id="btn-open" onclick="openBrowser()">📁 Open Folder</button>
  <button class="ghost" id="btn-clear" onclick="clearDone()" style="display:none">Clear done</button>
  <div class="spacer"></div>
  <div class="stats" id="stats" style="display:none">
    <span class="stat-item"><span class="n" id="s-queued">0</span> queued</span>
    <span class="stat-item converting"><span class="n" id="s-converting">0</span> converting</span>
    <span class="stat-item done"><span class="n" id="s-done">0</span> done</span>
    <span class="stat-item error"><span class="n" id="s-error">0</span> failed</span>
    <span class="stat-item saved" id="stat-saved" style="display:none"><span class="n" id="s-saved"></span> saved</span>
  </div>
</div>

<!-- job list or empty state -->
<div class="job-scroll" id="job-scroll">
  <div class="empty" id="empty">
    <div class="empty-icon">🎵</div>
    <div class="empty-text">No conversions yet</div>
    <div class="empty-hint">Click <strong>Open Folder</strong> to browse and convert audio files</div>
  </div>
  <div id="job-groups" style="display:none"></div>
</div>

<!-- folder browser overlay -->
<div class="overlay hidden" id="overlay" onclick="overlayClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">Open Folder</span>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="breadcrumbs" id="breadcrumbs"></div>
    <div class="browser-list" id="browser-list"></div>
    <div class="modal-footer">
      <span class="path-display" id="path-display"></span>
      <span class="preview-chip" id="preview-chip" style="display:none"></span>
      <label class="check"><input type="checkbox" id="chk-recursive" checked> Subdirectories</label>
      <label class="check"><input type="checkbox" id="chk-keep"> Keep originals</label>
      <button id="btn-convert" onclick="convertCurrent()" disabled>Convert</button>
    </div>
  </div>
</div>

<script>
  // ── state ──────────────────────────────────────────────────────────────────
  let currentPath = '';
  let previewTimer = null;
  let jobs = [];

  // ── browser ────────────────────────────────────────────────────────────────
  async function openBrowser() {
    document.getElementById('overlay').classList.remove('hidden');
    await browse('');
  }

  function closeModal() {
    document.getElementById('overlay').classList.add('hidden');
    clearTimeout(previewTimer);
  }

  function overlayClick(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  async function browse(path) {
    currentPath = '';
    const btnConvert = document.getElementById('btn-convert');
    btnConvert.disabled = true;
    btnConvert.textContent = 'Convert';
    document.getElementById('preview-chip').style.display = 'none';
    document.getElementById('path-display').textContent = 'Loading…';
    document.getElementById('browser-list').innerHTML = '';

    let data;
    try {
      const r = await fetch('/api/browse?path=' + encodeURIComponent(path));
      if (!r.ok) { showBrowserError('Cannot open: ' + path); return; }
      data = await r.json();
    } catch { showBrowserError('Network error'); return; }

    currentPath = data.path;
    document.getElementById('path-display').textContent = data.path;
    document.getElementById('btn-convert').disabled = false;

    // Breadcrumbs
    const bc = document.getElementById('breadcrumbs');
    bc.innerHTML = data.breadcrumbs.map((c, i) => {
      const active = i === data.breadcrumbs.length - 1;
      return `<span class="crumb ${active ? 'active' : ''}"
        ${active ? '' : `onclick="browse('${esc(c.path)}')" title="${esc(c.path)}"`}
      >${esc(c.name)}</span>`;
    }).join('');

    // Entries
    const list = document.getElementById('browser-list');
    let html = '';

    if (data.dirs.length === 0 && data.audioFiles.length === 0) {
      html = '<div class="browser-empty">Empty folder</div>';
    }

    for (const d of data.dirs) {
      html += `<div class="browser-entry dir" onclick="browse('${esc(d.path)}')">
        <span class="entry-icon">📁</span>
        <span class="entry-name" title="${esc(d.path)}">${esc(d.name)}</span>
        <span style="color:var(--muted);font-size:12px">›</span>
      </div>`;
    }

    for (const f of data.audioFiles) {
      html += `<div class="browser-entry audio">
        <span class="entry-icon">🎵</span>
        <span class="entry-name" title="${esc(f.path)}">${esc(f.name)}</span>
        ${f.converted ? '<span class="converted-badge">✓ MP3</span>' : ''}
      </div>`;
    }

    list.innerHTML = html;

    schedulePreview();
  }

  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(fetchPreview, 200);
  }

  async function fetchPreview() {
    if (!currentPath) return;
    const recursive = document.getElementById('chk-recursive').checked;

    // Re-fetch when recursive changes
    document.getElementById('chk-recursive').onchange = schedulePreview;

    try {
      const r = await fetch('/api/preview?path=' + encodeURIComponent(currentPath));
      if (!r.ok) return;
      const d = await r.json();
      const chip = document.getElementById('preview-chip');
      chip.style.display = '';
      if (d.unconverted === 0) {
        chip.className = 'preview-chip';
        chip.textContent = '✓ all converted';
        document.getElementById('btn-convert').disabled = true;
      } else {
        chip.className = 'preview-chip has-files';
        chip.textContent = `${d.unconverted} file${d.unconverted !== 1 ? 's' : ''} to convert`;
        document.getElementById('btn-convert').disabled = false;
      }
    } catch {}
  }

  async function convertCurrent() {
    if (!currentPath) return;
    const keepOriginals = document.getElementById('chk-keep').checked;
    const recursive     = document.getElementById('chk-recursive').checked;

    const btn = document.getElementById('btn-convert');
    btn.disabled = true;
    btn.textContent = 'Queueing…';

    try {
      const r = await fetch('/api/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: currentPath, keepOriginals, recursive }),
      });
      const d = await r.json();
      if (d.queued > 0) { closeModal(); }
      else { btn.textContent = 'Nothing new'; setTimeout(() => { btn.textContent = 'Convert'; btn.disabled = false; }, 2000); }
    } catch {
      btn.textContent = 'Error';
      setTimeout(() => { btn.textContent = 'Convert'; btn.disabled = false; }, 2000);
    }
  }

  function showBrowserError(msg) {
    document.getElementById('browser-list').innerHTML =
      `<div class="browser-empty" style="color:var(--red)">${esc(msg)}</div>`;
  }

  // ── job list ───────────────────────────────────────────────────────────────
  async function fetchJobs() {
    try {
      const r = await fetch('/api/jobs');
      const d = await r.json();
      jobs = d.jobs;
      renderStats(d.stats);
      renderJobs(d.jobs);
    } catch {}
  }

  function renderStats(s) {
    document.getElementById('s-queued').textContent     = s.queued;
    document.getElementById('s-converting').textContent = s.converting;
    document.getElementById('s-done').textContent       = s.done;
    document.getElementById('s-error').textContent      = s.errors;

    const savedEl = document.getElementById('stat-saved');
    if (s.savedBytes > 0) {
      document.getElementById('s-saved').textContent = formatBytes(s.savedBytes);
      savedEl.style.display = '';
    } else {
      savedEl.style.display = 'none';
    }

    const total = s.queued + s.converting + s.done + s.errors;
    document.getElementById('stats').style.display    = total > 0 ? '' : 'none';
    document.getElementById('btn-clear').style.display = (s.done + s.errors) > 0 ? '' : 'none';
  }

  function renderJobs(jobs) {
    const empty  = document.getElementById('empty');
    const groups = document.getElementById('job-groups');

    if (jobs.length === 0) {
      empty.style.display  = '';
      groups.style.display = 'none';
      return;
    }

    empty.style.display  = 'none';
    groups.style.display = '';

    // Group by dir, preserving first-seen order
    const order = { converting: 0, queued: 1, error: 2, done: 3 };
    const sorted = [...jobs].sort((a, b) => {
      const od = (order[a.status] ?? 9) - (order[b.status] ?? 9);
      return od !== 0 ? od : a.name.localeCompare(b.name);
    });

    const byDir = new Map();
    for (const j of sorted) {
      if (!byDir.has(j.dir)) byDir.set(j.dir, []);
      byDir.get(j.dir).push(j);
    }

    // Rebuild keeping existing collapse state
    const existing = new Map();
    groups.querySelectorAll('.group[data-dir]').forEach(g => {
      existing.set(g.dataset.dir, g.classList.contains('collapsed'));
    });

    let html = '';
    for (const [dir, files] of byDir) {
      const collapsed = existing.get(dir) ? 'collapsed' : '';
      html += `<div class="group ${collapsed}" data-dir="${esc(dir)}">
        <div class="group-header" onclick="toggleGroup(this.parentElement)">
          <i class="chevron">▾</i>${esc(dir)}
        </div>
        <div class="group-files">`;

      for (const j of files) {
        const badge = statusBadge(j);
        const sizeInfo = j.status === 'done' && j.sourceBytes > 0
          ? `<div class="job-size">${formatBytes(j.sourceBytes)} → ${formatBytes(j.convertedBytes)} <span class="size-saving">(-${Math.round((1 - j.convertedBytes / j.sourceBytes) * 100)}%)</span></div>`
          : '';
        html += `<div class="job-row">
          ${badge}
          <span class="job-name" title="${esc(j.path)}">${esc(j.name)}</span>
          <span class="job-time">${j.elapsed != null ? j.elapsed.toFixed(1) + 's' : ''}</span>
          ${j.error ? `<span class="job-error" title="${esc(j.error)}">${esc(j.error)}</span>` : ''}
          ${sizeInfo}
        </div>`;
      }

      html += '</div></div>';
    }

    groups.innerHTML = html;
  }

  function statusBadge(j) {
    if (j.status === 'queued')
      return '<span class="badge badge-queued">Queued</span>';
    if (j.status === 'converting')
      return '<span class="badge badge-converting"><span class="spinner"></span>Converting</span>';
    if (j.status === 'done')
      return '<span class="badge badge-done">✓ Done</span>';
    return '<span class="badge badge-error">✕ Failed</span>';
  }

  function toggleGroup(el) {
    el.classList.toggle('collapsed');
  }

  async function clearDone() {
    await fetch('/api/jobs', { method: 'DELETE' });
    fetchJobs();
  }

  // ── helpers ────────────────────────────────────────────────────────────────
  function formatBytes(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }

  // ── XSS escape ─────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  // ── init ───────────────────────────────────────────────────────────────────
  fetchJobs();
  setInterval(fetchJobs, 2000);
</script>
</body>
</html>
